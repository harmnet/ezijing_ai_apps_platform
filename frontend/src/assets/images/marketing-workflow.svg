  <text x="120" y="260" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">营销策划经理</text>
  
  <!-- 步骤2 -->
  <circle cx="250" cy="120" r="45" fill="#ba003f" opacity="0.8"/>
