name: Build and Push Docker Images

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 构建前端镜像
      - name: Build and push Frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ezijing-frontend:latest
            ghcr.io/${{ github.repository_owner }}/ezijing-frontend:${{ github.sha }}

      # 构建后端镜像
      - name: Build and push Backend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ezijing-backend:latest
            ghcr.io/${{ github.repository_owner }}/ezijing-backend:${{ github.sha }}

      # 构建Node.js镜像
      - name: Build and push Node.js image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.nodejs
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ezijing-nodejs:latest
            ghcr.io/${{ github.repository_owner }}/ezijing-nodejs:${{ github.sha }} 