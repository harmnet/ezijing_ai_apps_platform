name: Build and Push Docker Images

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Backend image
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ezijing-backend:latest
            ghcr.io/${{ github.repository_owner }}/ezijing-backend:${{ github.sha }}

  build-nodejs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Node.js image
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile.nodejs
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ezijing-nodejs:latest
            ghcr.io/${{ github.repository_owner }}/ezijing-nodejs:${{ github.sha }}

  build-frontend-image:
    runs-on: ubuntu-latest
    needs: [build-backend, build-nodejs]
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      
      - name: Create and configure dist directory
        run: |
          mkdir -p frontend/dist
          echo '<html><head><title>紫荆AI应用平台</title></head><body><h1>紫荆AI应用平台</h1><p>前端构建中...</p></body></html>' > frontend/dist/index.html
          echo "Created placeholder frontend/dist/index.html"
          ls -la frontend/dist
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Frontend image
        uses: docker/build-push-action@v2
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.simple
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ezijing-frontend:latest
            ghcr.io/${{ github.repository_owner }}/ezijing-frontend:${{ github.sha }} 