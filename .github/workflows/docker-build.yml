name: Build and Push Docker Images

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-all-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # 设置Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录GitHub容器注册表
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 前端：确认dist目录存在并且构建前端镜像
      - name: Check frontend dist directory
        run: |
          echo "检查前端构建目录"
          ls -la frontend/
          ls -la frontend/dist/ || mkdir -p frontend/dist
          
          if [ ! -f "frontend/dist/index.html" ]; then
            echo "警告：dist/index.html不存在，将从public目录复制内容"
            cp -R frontend/public/* frontend/dist/ || true
          fi
          
          echo "前端dist目录内容:"
          ls -la frontend/dist/

      # 构建并推送前端镜像
      - name: Build and push Frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.simple
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ezijing-frontend:latest
            ghcr.io/${{ github.repository_owner }}/ezijing-frontend:${{ github.sha }}

      # 构建并推送后端镜像
      - name: Build and push Backend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ezijing-backend:latest
            ghcr.io/${{ github.repository_owner }}/ezijing-backend:${{ github.sha }}

      # 构建并推送Node.js镜像
      - name: Build and push Node.js image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.nodejs
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ezijing-nodejs:latest
            ghcr.io/${{ github.repository_owner }}/ezijing-nodejs:${{ github.sha }} 