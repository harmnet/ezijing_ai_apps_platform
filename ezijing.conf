server {
    listen 80;
    server_name _;
    
    # 测试API专用转发 - 放在最前面
    # 注意：在生产环境中，可能需要将localhost替换为内部服务地址
    location = /test-api {
        proxy_pass http://localhost:9010/test-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # 测试API直接转发 - 放在最前面
    # 注意：在生产环境中，可能需要将localhost替换为内部服务地址
    location = /api-direct-test {
        proxy_pass http://localhost:9003/api-direct-test;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # LLM模型列表API - 将在后端实现，不再使用硬编码JSON响应
    # location = /api/v1/llm/models {
    #    add_header Content-Type application/json;
    #    return 200 '[硬编码的模型列表，已移除]';
    # }
    
    # API转发规则
    # 注意：在生产环境中，可能需要将localhost替换为内部服务地址
    location /api/ {
        proxy_pass http://localhost:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSE流式响应需要的配置
        proxy_buffering off;           # 关闭缓冲，立即转发响应
        proxy_cache off;               # 禁用缓存
        chunked_transfer_encoding on;  # 启用分块传输编码
        tcp_nodelay on;                # 启用TCP_NODELAY选项
        tcp_nopush off;                # 禁用TCP_NOPUSH选项
        proxy_read_timeout 3600s;      # 增加读取超时时间
    }
    
    # Socket.IO转发
    # 注意：在生产环境中，可能需要将localhost替换为内部服务地址
    location /socket.io/ {
        proxy_pass http://localhost:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # 静态文件服务 - 放在最后
    location / {
        root /opt/ezijing_ai_apps_platform/frontend;
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存设置
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg)$ {
        root /opt/ezijing_ai_apps_platform/frontend;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 安全性设置
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # 日志设置
    access_log /var/log/nginx/ezijing.access.log;
    error_log /var/log/nginx/ezijing.error.log;
} 